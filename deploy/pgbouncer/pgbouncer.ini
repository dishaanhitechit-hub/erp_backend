;; PgBouncer for the ERP backend — see README.md in this folder.
;;
;; Sized for one in-house server (i7 14th gen, 32 GB) running Gunicorn with up
;; to 8 workers + the scheduler process. Check the numbers against your
;; Postgres `max_connections` before going live (README, step 1).

[databases]
;; the app connects to PgBouncer with the same database name it uses today
;; (DB_NAME); PgBouncer forwards to the real Postgres.
;; CHANGE: dbname to your DB_NAME, port to the real Postgres port.
erp_db = host=127.0.0.1 port=5432 dbname=erp_db

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

;; ── authentication ───────────────────────────────────────────────
;; Same users / passwords as Postgres. userlist.txt holds the SCRAM secrets
;; (README, step 2). Keep it readable only by the pgbouncer user.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; ── pooling ──────────────────────────────────────────────────────
;; transaction: a server connection is lent to a client for one transaction.
;; Works with this app: psycopg2 does not use server-side prepared statements,
;; row locks and pg_advisory_xact_lock are per transaction, and the scheduler
;; no longer uses session-level advisory locks (Phase 2).
pool_mode = transaction

;; clients PgBouncer accepts (web workers open one per request)
max_client_conn = 500
;; real Postgres connections per database/user pair — ERP queries are short;
;; about one per CPU core is plenty
default_pool_size = 20
;; extra connections for bursts, after a client waited reserve_pool_timeout
reserve_pool_size = 5
reserve_pool_timeout = 3
;; hard ceiling on real Postgres connections from PgBouncer. Keep it well below
;; Postgres max_connections so migrations, backups and psql still get in.
max_db_connections = 30
;; keep a few connections warm
min_pool_size = 2

;; ── timeouts (seconds) ───────────────────────────────────────────
;; a request waiting longer than this for a free connection gets an error
;; (the app answers 500 JSON) instead of hanging
query_wait_timeout = 30
;; kill a client that sits "idle in transaction" (a bug or a crashed worker)
;; so it cannot hold row locks
idle_transaction_timeout = 60
;; close unused server connections
server_idle_timeout = 600
;; recycle every server connection after an hour
server_lifetime = 3600
;; how long to try reaching Postgres
server_connect_timeout = 5
;; give up on a Postgres that stopped answering at login
server_login_retry = 5

;; transaction mode cannot keep per-session settings; psycopg2 sends this one
ignore_startup_parameters = extra_float_digits,options

;; nothing to reset between clients in transaction mode
server_reset_query =

;; ── admin / logs ─────────────────────────────────────────────────
;; `psql -p 6432 -U <admin> pgbouncer -c "SHOW POOLS"` for live numbers
admin_users = postgres
stats_users = postgres
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

# /etc/nginx/sites-available/prax-console  →  http://132.154.156.82:6800/
server {
    listen 6800;
    server_name _;

    # SECURITY: this console can replace the live database. Allow only trusted
    # networks. Put your office's public IP here, then remove the "#".
    # allow 203.0.113.10;      # office
    # allow 192.168.0.0/16;    # local network
    # deny  all;

    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:6791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
